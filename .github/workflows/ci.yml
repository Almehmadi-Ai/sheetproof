name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (pinned in requirements-dev.txt)
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check .

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11, latest dependencies
            python-version: "3.11"
            pins: ""
          - name: Python 3.12, latest dependencies
            python-version: "3.12"
            pins: ""
          # The versions Open WebUI 0.12.2 ships (pandas 3 with pyarrow-backed strings).
          - name: Open WebUI 0.12.2 pins
            python-version: "3.12"
            pins: "pandas==3.0.3 pyarrow==20.0.0 numpy==2.4.6 openpyxl==3.1.5 xlrd==2.0.2 pydantic==2.13.4"
          # The oldest supported stack: what Open WebUI 0.5 / 0.6 ship.
          - name: Open WebUI 0.5 pins
            python-version: "3.11"
            pins: "pandas==2.2.3 numpy==2.2.6 openpyxl==3.1.5 xlrd==2.0.1 pydantic==2.10.6"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ${{ matrix.pins }}

      - name: Sample data is reproducible
        run: |
          python examples/generate_samples.py
          git diff --exit-code -- examples/sample_sales.csv

      - name: Run tests
        run: python -m pytest -q
