name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Generate sample data
        run: python examples/generate_samples.py

      - name: Run tests
        run: pytest -q

      - name: Import check (plugins load cleanly outside Open WebUI)
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("sheetproof", "sheetproof_router"):
              spec = importlib.util.spec_from_file_location(name, f"{name}.py")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              print(f"{name}.py imports OK")
          PY
